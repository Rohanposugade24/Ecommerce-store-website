<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electronics Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Electronics Store</h1>
    <p>Latest Gadgets & Accessories</p>
  </header>

  <section class="products-container">

    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Smartphone">
      <h3>Smartphone</h3>
      <p>₹24,999</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1517336714739-489689fd1ca8" alt="Laptop">
      <h3>Laptop</h3>
      <p>₹59,999</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="Headphones">
      <h3>Headphones</h3>
      <p>₹2,999</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12" alt="Smart Watch">
      <h3>Smart Watch</h3>
      <p>₹4,499</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505" alt="Bluetooth Speaker">
      <h3>Bluetooth Speaker</h3>
      <p>₹1,999</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad" alt="Camera">
      <h3>Camera</h3>
      <p>₹44,999</p>
      <button>Add to Cart</button>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
